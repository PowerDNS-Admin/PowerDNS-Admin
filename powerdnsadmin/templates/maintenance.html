<!DOCTYPE html>
<html lang="en" class>
<head>
    {% include 'includes/theme_bootstrap.html' %}
    <title>Site Maintenance</title>
    <style>
        body {
            text-align: center;
            padding: 150px;
        }

        h1 {
            font-size: 50px;
        }

        body {
            font: 20px Helvetica, sans-serif;
            color: #212529;
            background-color: #fff;
        }

        [data-bs-theme="dark"] body {
            color: #dee2e6;
            background-color: #212529;
        }

        article {
            display: block;
            text-align: left;
            width: 650px;
            margin: 0 auto;
        }

        a {
            color: #dc8100;
            text-decoration: none;
        }

        a:hover {
            color: #333;
            text-decoration: none;
        }

        [data-bs-theme="dark"] a:hover {
            color: #f8f9fa;
        }
    </style>
</head>
<body>
<article>
    <h1>We&rsquo;ll be back soon!</h1>
    <div>
        <p>Sorry for the inconvenience but we&rsquo;re performing some maintenance at the moment. Please contact the
            System
            Administrator if you need more information, otherwise we&rsquo;ll be back online shortly!</p>
        <p>&mdash; Team</p>
    </div>
</article>
</body>
</html>
