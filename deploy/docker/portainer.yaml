version: '3.3'
services:

  core:
    image: powerdnsadmin/pda-legacy:latest
    restart: unless-stopped
    environment:
      # Replace SECRET_KEY before starting. Startup refuses a missing, short, or published key.
      # SECRET_KEY: python3 -c "import secrets; print(secrets.token_hex(32))"
      # A salt published in this repository logs a warning. replace-me is not a bcrypt salt.
      - SECRET_KEY=replace-me
      - SALT=replace-me
    ports:
      - "12000:9191"
    volumes:
      - "core_data:/data"

volumes:
  core_data:
