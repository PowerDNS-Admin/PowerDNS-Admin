services:
  powerdns-admin:
    image: powerdns-admin-test
    build:
      context: .
      dockerfile: docker-test/Dockerfile
    container_name: powerdns-admin-test
    ports:
      - "9191:80"
    networks:
      - default
    env_file:
      - ./docker-test/env
    environment:
      FLASK_CONF: /app/configs/docker_config.py
      POWERDNS_ADMIN_MODE: ${POWERDNS_ADMIN_MODE:-dev}
    volumes:
      - powerdns-admin-data:/data
    depends_on:
      - pdns-server

  pdns-server:
    image: pdns-server-test
    build:
      context: .
      dockerfile: docker-test/Dockerfile.pdns
    ports:
      - "5053:53"
      - "5053:53/udp"
      - "8081:8081"
    networks:
      - default
    env_file:
      - ./docker-test/env

networks:
  default:

volumes:
  powerdns-admin-data:
