include         /etc/openldap/schema/core.schema
include         /etc/openldap/schema/cosine.schema
include         /etc/openldap/schema/inetorgperson.schema

pidfile         /run/openldap/slapd.pid
argsfile        /run/openldap/slapd.args

modulepath      /usr/lib/openldap
moduleload      back_mdb.so
moduleload      memberof.so
moduleload      refint.so

# Development ACLs: authenticated binds can read the directory; anonymous
# clients may only authenticate.
access to attrs=userPassword
    by self write
    by anonymous auth
    by * none

access to *
    by self read
    by users read
    by * none

database        mdb
suffix          "dc=example,dc=org"
rootdn          "cn=admin,dc=example,dc=org"
rootpw          DevPassword123!
directory       /var/lib/openldap/openldap-data
index           objectClass eq
index           uid eq
index           cn eq
index           member eq
maxsize         134217728

overlay         memberof
memberof-group-oc groupOfNames
memberof-member-ad member
memberof-memberof-ad memberOf
memberof-refint true

overlay         refint
refint_attributes member memberOf
refint_nothing cn=admin,dc=example,dc=org
