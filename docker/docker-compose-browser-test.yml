name: powerdns-admin-browser-test

services:
  powerdns-admin:
    image: powerdns-admin-browser-test-app
    build:
      context: ..
      dockerfile: docker/common/Dockerfile.app
      args:
        DOCKER_SCENARIO: browser-test
        INSTALL_TEST_DEPENDENCIES: "1"
    networks:
      - browser-test
    env_file:
      - browser-test/env
    environment:
      FLASK_CONF: /app/configs/docker_config.py
      SQLALCHEMY_DATABASE_URI: mysql://powerdns_admin:changeme@mysql/powerdns_admin
      PDNS_HOST: pdns-server
      PDNS_API_KEY: ${PDNS_API_KEY:-changeme}
      BROWSER_TEST_USERNAME: ${BROWSER_TEST_USERNAME:-browser-admin}
      BROWSER_TEST_PASSWORD: ${BROWSER_TEST_PASSWORD:-BrowserTest123!}
    depends_on:
      mysql:
        condition: service_healthy
      pdns-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/browser-test-ready && curl --fail --silent http://localhost/login"]
      interval: 2s
      timeout: 2s
      retries: 90

  pdns-server:
    image: powerdns/pdns-auth-51:5.1.3
    networks:
      - browser-test
    env_file:
      - browser-test/env
    environment:
      PDNS_AUTH_API_KEY: ${PDNS_API_KEY:-changeme}
      TEMPLATE_FILES: pdns-database
      PDNS_LAUNCH: gmysql
      PDNS_DB_HOST: mysql
      PDNS_DB_PORT: 3306
      PDNS_DB_NAME: powerdns
      PDNS_DB_USER: powerdns
      PDNS_DB_PASSWORD: changeme
    volumes:
      - ./common/pdns.conf:/etc/powerdns/pdns.conf:ro
      - ./common/pdns-database.conf.j2:/etc/powerdns/templates.d/pdns-database.j2:ro
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    networks:
      - browser-test
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: powerdns_admin
      MYSQL_USER: powerdns_admin
      MYSQL_PASSWORD: changeme
    volumes:
      - ./common/mysql-init.sql:/docker-entrypoint-initdb.d/10-powerdns.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  browser-tests:
    image: powerdns-admin-browser-tests
    # Chrome and Edge stable Linux packages are x86_64-only.
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/browser-test/browser/Dockerfile
    init: true
    ipc: host
    networks:
      - browser-test
    environment:
      BASE_URL: http://powerdns-admin
      PDNS_API_URL: http://pdns-server:8081
      EXPECTED_PDNS_API_URL: http://pdns-server:8081
      PDNS_API_KEY: ${PDNS_API_KEY:-changeme}
      BROWSER_TEST_USERNAME: ${BROWSER_TEST_USERNAME:-browser-admin}
      BROWSER_TEST_PASSWORD: ${BROWSER_TEST_PASSWORD:-BrowserTest123!}
    volumes:
      - ./test-results/browser:/tests/test-results
      - ./playwright-report:/tests/playwright-report
    depends_on:
      powerdns-admin:
        condition: service_healthy

networks:
  browser-test:
