services:
  app:
    image: powerdns-admin-prod-app
    build:
      context: ..
      dockerfile: docker/common/Dockerfile.app
      args:
        DOCKER_SCENARIO: production
    container_name: powerdns_admin
    ports:
      - "9191:80"
    logging:
      driver: json-file
      options:
        max-size: 50m
    environment:
      FLASK_CONF: /app/configs/docker_config.py
      DATABASE_DRIVER: mysql
      DATABASE_USER: pda
      DATABASE_PASSWORD: changeme
      DATABASE_HOST: mysql
      DATABASE_NAME: pda
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: pda
      MYSQL_USER: pda
      MYSQL_PASSWORD: changeme
    volumes:
      - pda-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pda-mysql:
