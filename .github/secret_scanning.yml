# Intentional lab credentials for local Compose / CI only.
# GitHub Secret Scanning closes alerts here as "ignored by configuration"
# and excludes these paths from push protection.
# https://docs.github.com/en/code-security/how-tos/secure-your-secrets/customize-leak-detection/exclude-folders-and-files
paths-ignore:
  - docker/dev/**
  - docker/test/**
  - docker/docker-compose-dev.yml
  - docker/docker-compose-dev.freeipa.yml
  - docker/docker-compose-test.yml
  - docker/docker-compose-browser-test.yml
  # docker/common/*-init.sql are shared by the dev and test compose stacks
  # (see docker/docker-compose-dev.yml, docker/docker-compose-test.yml, and
  # the -browser-test/-dev.freeipa variants). They are not referenced by any
  # production deployment path — do not reuse these credentials or scripts
  # in production.
  - docker/common/postgres-init.sql
  - docker/common/mysql-init.sql
  - configs/test.py
  - docs/running_tests.md
