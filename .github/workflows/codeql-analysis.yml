---
name: CodeQL

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
    # When to run (allowlist). Kept in sync with the paths: allowlist in
    # .github/codeql/codeql-config.yml, which also controls what to analyze.
    paths:
      - 'powerdnsadmin/**'
      - 'configs/**'
      - 'migrations/**'
      - 'run.py'
      - 'update_accounts.py'
      - 'update_zones.py'
      - '.github/workflows/codeql-analysis.yml'
      - '.github/codeql/**'
  pull_request:
    branches:
      - dev
      - master
    paths:
      - 'powerdnsadmin/**'
      - 'configs/**'
      - 'migrations/**'
      - 'run.py'
      - 'update_accounts.py'
      - 'update_zones.py'
      - '.github/workflows/codeql-analysis.yml'
      - '.github/codeql/**'
  schedule:
    - cron: '45 2 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
