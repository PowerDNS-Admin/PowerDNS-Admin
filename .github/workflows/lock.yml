---
name: Lock inactive closed threads

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock-inactive-threads
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lock inactive closed issues and pull requests
        uses: dessant/lock-threads@v6
        with:
          issue-inactive-days: '90'
          pr-inactive-days: '30'
          issue-lock-reason: resolved
          exclude-any-issue-labels: 'bug / security-vulnerability, mod / announcement, mod / accepted, mod / reviewing, mod / testing'
          exclude-any-pr-labels: 'bug / security-vulnerability, mod / announcement, mod / accepted, mod / reviewing, mod / testing'
