---
name: Update release notes

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-notes-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  update-release-notes:
    name: Build release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate CalVer release tag
        run: >-
          python3 .github/scripts/validate-release-version.py
          "${{ github.event.release.tag_name }}"

      - name: Find previous release tag
        id: previous
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^")"
          echo "tag=${previous_tag}" >> "${GITHUB_OUTPUT}"

      - name: Generate GitHub contributor notes
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh api
          --method POST
          "repos/${GITHUB_REPOSITORY}/releases/generate-notes"
          --field "tag_name=${RELEASE_TAG}"
          --field "previous_tag_name=${PREVIOUS_TAG}"
          > generated-release-notes.json

      - name: Build idempotent release update
        run: |
          python3 .github/scripts/update-release-notes.py \
            --event "${GITHUB_EVENT_PATH}" \
            --changelog CHANGELOG.md \
            --generated-notes generated-release-notes.json \
            --support app-support.json \
            --output release-update.json

      - name: Update release body
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --input release-update.json
