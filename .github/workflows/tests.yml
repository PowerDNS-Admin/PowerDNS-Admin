---
name: Python tests

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - dev
      - master

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.12'
          - '3.14'
    env:
      PDNS_API_KEY: changeme
      PDNS_HOST: localhost
      PDNS_PORT: '8081'
      PDNS_PROTO: http
      SQLALCHEMY_DATABASE_URI: mysql://powerdns_admin:changeme@127.0.0.1/powerdns_admin
      SESSION_TYPE: sqlalchemy
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: changeme
          MYSQL_DATABASE: powerdns_admin
          MYSQL_USER: powerdns_admin
          MYSQL_PASSWORD: changeme
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pchangeme --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            default-libmysqlclient-dev \
            libffi-dev \
            libldap2-dev \
            libpq-dev \
            libsasl2-dev \
            libssl-dev \
            libxml2-dev \
            libxmlsec1-dev \
            libxmlsec1-openssl \
            libxslt1-dev \
            pkg-config

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip --requirement requirements-dev.txt

      - name: Build frontend assets
        env:
          FLASK_APP: powerdnsadmin/__init__.py
          # Avoid requiring a live DB during asset compilation.
          SESSION_TYPE: filesystem
          YARN_NODE_LINKER: node-modules
        run: |
          corepack enable
          yarn install --immutable --inline-builds
          ln -s ../../node_modules powerdnsadmin/static/node_modules
          flask assets build

      - name: Reject invalid Python escape sequences
        run: python -W error::SyntaxWarning -m compileall -q powerdnsadmin tests

      - name: Test release tooling
        run: python -m unittest discover -s .github/scripts/tests -v

      - name: Run unit tests
        run: python -m pytest --capture=no --verbose tests/unit

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PDNS_API_KEY: changeme
      PDNS_HOST: localhost
      PDNS_PORT: '8081'
      PDNS_PROTO: http
      SQLALCHEMY_DATABASE_URI: mysql://powerdns_admin:changeme@127.0.0.1/powerdns_admin
      SESSION_TYPE: sqlalchemy
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: changeme
          MYSQL_DATABASE: powerdns_admin
          MYSQL_USER: powerdns_admin
          MYSQL_PASSWORD: changeme
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pchangeme --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            default-libmysqlclient-dev \
            libffi-dev \
            libldap2-dev \
            libpq-dev \
            libsasl2-dev \
            libssl-dev \
            libxml2-dev \
            libxmlsec1-dev \
            libxmlsec1-openssl \
            libxslt1-dev \
            pkg-config

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip --requirement requirements-dev.txt

      - name: Build frontend assets
        env:
          FLASK_APP: powerdnsadmin/__init__.py
          # Avoid requiring a live DB during asset compilation.
          SESSION_TYPE: filesystem
          YARN_NODE_LINKER: node-modules
        run: |
          corepack enable
          yarn install --immutable --inline-builds
          ln -s ../../node_modules powerdnsadmin/static/node_modules
          flask assets build

      - name: Run smoke tests
        run: python -m pytest --capture=no --verbose tests/smoke

  full-suite:
    name: Python tests (full suite)
    needs:
      - unit
      - smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run complete Python test suite
        run: |
          docker compose -f docker/docker-compose-test.yml up \
            --build \
            --force-recreate \
            --abort-on-container-exit \
            --exit-code-from python-tests

      - name: Capture Compose logs
        if: failure()
        run: docker compose -f docker/docker-compose-test.yml logs --no-color > python-tests.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-logs-${{ github.run_id }}
          path: python-tests.log
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down test environment
        if: always()
        run: docker compose -f docker/docker-compose-test.yml down --volumes --remove-orphans

  required:
    name: Python tests
    if: always()
    needs:
      - unit
      - smoke
      - full-suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Python test job to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          FULL_SUITE_RESULT: ${{ needs.full-suite.result }}
        run: |
          test "${UNIT_RESULT}" = success
          test "${SMOKE_RESULT}" = success
          test "${FULL_SUITE_RESULT}" = success

  docker-changes:
    name: Check for Docker image changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed paths
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "${EVENT_NAME}" != push ] || [ "${REF_TYPE}" = tag ]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          ignored_only=true
          if [ -z "${BEFORE_SHA}" ] ||
             [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "${BEFORE_SHA}^{commit}"; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          changed_files=(git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}")

          while IFS= read -r changed_path; do
            case "${changed_path}" in
              .github/*|deploy/*|docker/test/*|docs/*|.dockerignore|.gitattributes|.gitignore|.whitesource|.yarnrc|LICENSE|README.md|SECURITY.md)
                ;;
              *)
                ignored_only=false
                break
                ;;
            esac
          done < <("${changed_files[@]}")

          if [ "${ignored_only}" = true ]; then
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          fi

  docker-image:
    name: Build and publish Docker image
    needs:
      - required
      - docker-changes
    if: >-
      needs.required.result == 'success' &&
      needs.docker-changes.outputs.should_build == 'true' &&
      github.repository == 'PowerDNS-Admin/PowerDNS-Admin' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/build-and-publish.yml
    secrets: inherit
