---
name: MegaLinter

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Validate compiled Debian 13.6 image
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repository checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Debian 13.6 application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/common/Dockerfile.app
          load: true
          tags: powerdns-admin/megalinter-debian13.6:${{ github.sha }}
          build-args: |
            DEBIAN_VERSION=13.6
            DOCKER_SCENARIO=production
            INSTALL_TEST_DEPENDENCIES=0
            PYTHON_FULL_VERSION=3.13.5
            PYTHON_PATCH_LEVEL=5
          cache-from: type=gha,scope=megalinter-debian13.6
          cache-to: type=gha,mode=max,scope=megalinter-debian13.6

      - name: Extract compiled application library
        env:
          LINT_IMAGE: powerdns-admin/megalinter-debian13.6:${{ github.sha }}
        run: |
          mkdir "${GITHUB_WORKSPACE}/.megalinter-compiled"
          container_id="$(docker create "${LINT_IMAGE}")"
          trap 'docker rm --force "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker cp \
            "${container_id}:/app/." \
            "${GITHUB_WORKSPACE}/.megalinter-compiled/"
          docker rm "${container_id}"
          trap - EXIT

      - name: MegaLinter
        id: megalinter
        uses: oxsecurity/megalinter@v10
        env:
          CLEAR_REPORT_FOLDER: true
          DEFAULT_BRANCH: dev
          DEFAULT_WORKSPACE: ${{ github.workspace }}/.megalinter-compiled
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IGNORE_GITIGNORED_FILES: false
          VALIDATE_ALL_CODEBASE: true

      - name: Upload MegaLinter reports
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: megalinter-reports-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            megalinter-reports
            mega-linter.log
