---
name: Mark stale threads

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: stale-threads
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Process inactive issues and pull requests
        uses: actions/stale@v11
        with:
          days-before-issue-stale: 90
          days-before-issue-close: -1
          days-before-pr-stale: 90
          days-before-pr-close: 30
          exempt-all-issue-assignees: true
          exempt-all-issue-milestones: true
          exempt-draft-pr: true
          exempt-issue-labels: 'bug / security-vulnerability, mod / announcement, mod / accepted, mod / reviewing, mod / testing, mod / good-first-issue, mod / help-wanted'
          operations-per-run: 100
          remove-issue-stale-when-updated: true
          remove-pr-stale-when-updated: true
          stale-issue-label: 'mod / stale'
          stale-pr-label: 'mod / stale'
          stale-issue-message: >
            This issue has been marked stale because it has not had recent
            activity. It will remain open. If you can provide current
            reproduction details or other relevant information, please add them
            in a new comment and the stale label will be removed automatically.
          stale-pr-message: >
            This pull request has been marked stale because it has not had recent
            activity. Please comment with its current status or update the branch
            if you intend to continue. It will close after 30 more days without
            activity.
          close-pr-message: >
            This pull request was closed after an extended period without
            activity. It can be reopened if work resumes and the branch is
            brought up to date.
