---
name: 'Docker Image'

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
      - 'master'
    tags:
      - 'v*.*.*'
    paths-ignore:
      - .github/**
      - deploy/**
      - docker-test/**
      - docs/**
      - .dockerignore
      - .gitattributes
      - .gitignore
      - .lgtm.yml
      - .whitesource
      - .yarnrc
      - docker-compose.yml
      - docker-compose-test.yml
      - LICENSE
      - README.md
      - SECURITY.md

jobs:
  build-and-push-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5

      - name: Docker Image Metadata
        id: meta
        uses: docker/metadata-action@b2391d37b4157fa4aa2e118d643f417910ff3242
        with:
          images: |
            powerdnsadmin/pda-legacy
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: QEMU Setup
        uses: docker/setup-qemu-action@2b82ce82d56a2a04d2637cd93a637ae1b359c0a7

      - name: Docker Buildx Setup
        id: buildx
        uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9

      - name: Docker Hub Authentication
        uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_V2 }}
          password: ${{ secrets.DOCKERHUB_TOKEN_V2 }}

      - name: Docker Image Build
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9
        with:
          platforms: linux/amd64,linux/arm64
          context: ./
          file: ./docker/Dockerfile
          push: true
          tags: powerdnsadmin/pda-legacy:${{ github.ref_name }}

      - name: Docker Image Release Tagging
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          platforms: linux/amd64,linux/arm64
          context: ./
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
