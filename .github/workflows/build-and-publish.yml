---
name: 'Docker Image'

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-docker-image:
    name: Build Docker Image
    if: github.repository == 'PowerDNS-Admin/PowerDNS-Admin'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate CalVer release tag
        if: github.ref_type == 'tag'
        run: >-
          python3 .github/scripts/validate-release-version.py
          "${{ github.ref_name }}"

      - name: Docker Image Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: powerdnsadmin/pda-legacy
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=match,pattern=^v(\d{4}\.(?:0[1-9]|1[0-2])\.[1-9]\d*)$,group=1
            type=match,pattern=^v(\d{4}\.(?:0[1-9]|1[0-2]))\.[1-9]\d*$,group=1
            type=raw,value=${{ github.ref_name }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: QEMU Setup
        uses: docker/setup-qemu-action@v4

      - name: Docker Buildx Setup
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub Authentication
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_V2 }}
          password: ${{ secrets.DOCKERHUB_TOKEN_V2 }}

      - name: Docker Image Build and Push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: ./
          file: ./docker/common/Dockerfile.app
          build-args: |
            DOCKER_SCENARIO=production
            INSTALL_TEST_DEPENDENCIES=0
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
